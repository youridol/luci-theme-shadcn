name: luci-theme-shadcn Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build luci-theme-shadcn ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        sdk: ["24.10.4", "25.12.5"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: slug
        run: echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: eamonxg/build-luci-package@v2
        with:
          sdk: ${{ matrix.sdk }}
          packages: '[{"pkg":"luci-theme-shadcn","path":"."}]'
      - uses: actions/upload-artifact@v6
        with:
          name: luci-theme-shadcn-${{ steps.slug.outputs.ref }}-${{ steps.build.outputs.pkg_type }}
          path: out/*.[ai]pk
      - uses: eamonxg/build-luci-package/release@v2
        with:
          name: luci-theme-shadcn
          files: out/*.[ai]pk
          body_repo: eamonxg/assets
          body_path: shadcn/docs/changelog/${{ github.ref_name }}.md

  notify-feed:
    name: notify openwrt-cloud
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - name: Dispatch feed rebuild
        env:
          GH_TOKEN: ${{ secrets.FEED_DISPATCH_TOKEN }}
        run: |
          # 这是一个跨仓库动作：通知上游 eamonxg/openwrt-cloud 重建软件源。
          # 缺 token 时跳过而非失败 —— Release 与 ipk 都已经产出，feed 只是
          # 让新版本更快出现在软件源里（该源本身有每日计划任务兜底）。
          # 要让 tag 立刻进 feed，就给本仓库配 FEED_DISPATCH_TOKEN：一个对
          # eamonxg/openwrt-cloud 有 Contents 读写权限的 fine-grained PAT。
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::FEED_DISPATCH_TOKEN is not set; skipping the openwrt-cloud dispatch."
            echo "The release and its packages are unaffected — the feed still picks the new version"
            echo "up on its own daily schedule. Set FEED_DISPATCH_TOKEN to make it immediate."
            exit 0
          fi
          gh api repos/eamonxg/openwrt-cloud/dispatches \
            -f event_type=package-released \
            -f 'client_payload[repo]=${{ github.repository }}' \
            -f 'client_payload[tag]=${{ github.ref_name }}'
